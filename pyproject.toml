[project]
name = "sama-aqi-nigeria"
version = "0.1.0"
description = "Nigeria Air Quality Observatory — Streamlit app"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.40,<2",
    "pandas>=2.2,<4",
    "numpy>=1.26,<3",
    "plotly>=5.24,<8",
    "scikit-learn>=1.4,<2",
    "pyarrow>=15,<30",
    "openpyxl>=3.1,<4",
    "requests>=2.31,<3",
    "joblib>=1.3,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["."]

[tool.ruff.lint]
# C408 (unnecessary dict()) is unsafe for Plotly calls; leave as-is.
# E501: long strings (CSS/HTML/blurbs) are intentional presentation text.
ignore = ["C408", "BLE001", "E501"]
select = ["E", "F", "B", "C4"]

[tool.ruff.format]
